pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

# Patch/minor bumps for transitive advisories (pnpm audit --prod --audit-level high).
overrides:
  brace-expansion@>=4 <5.0.11: ^5.0.11
  js-yaml@>=4 <4.3.2: ^4.3.2
  fast-uri@>=3 <3.1.7: ^3.1.7
  ip-address@<10.3.1: ^10.3.1
  nanoid@<3.3.18: ^3.3.18
  browserslist@<4.28.7: ^4.28.7
  undici@>=7 <7.30.1: ^7.30.1
  source-map-js@<1.2.2: ^1.2.2
  proxy-addr@<2.0.8: ^2.0.8
  '@modelcontextprotocol/sdk@<1.32.0': ^1.32.0
  body-parser@>=2 <2.4.0: ^2.4.0
  hono@<4.13.11: ^4.13.11
  '@hono/node-server@<2.1.3': ^2.1.3
  baseline-browser-mapping@<2.11.0: ^2.11.0

# Install scripts: allow the two native-binary helpers the toolchain expects; deny the rest (not needed at runtime).
allowBuilds:
  esbuild: true
  unrs-resolver: true
  '@google/genai': false
  protobufjs: false
